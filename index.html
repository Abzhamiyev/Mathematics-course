<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QazCourse — математика курстары</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="js/data.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ===== АВТОРИЗАЦИЯ (ескі жобадан өзгертілмей сақталған) ===== */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("qaz_user")); } catch (e) { return null; } },
  set(u) { try { u ? localStorage.setItem("qaz_user", JSON.stringify(u)) : localStorage.removeItem("qaz_user"); } catch (e) {} }
};
// ДЕМО-слой. Бэкэнд дайын болғанда осы функциялардың ішін fetch() қылыңыз
const api = {
  async register({ name, email, role }) { await wait(700); return { name, email, role, purchases: [] }; },
  async login({ email }) { await wait(600); return { name: email.split("@")[0], email, role: "student", purchases: [] }; }
};
const strength = p => {
  let s = 0;
  if (p.length >= 8) s++;
  if (/[A-ZА-Я]/.test(p) && /[a-zа-я]/.test(p)) s++;
  if (/\d/.test(p)) s++;
  if (/[^\w\s]/.test(p) || p.length >= 12) s++;
  return s;
};
const LEVELS = ["", "Осал", "Орташа", "Жақсы", "Сенімді"];
const COLORS = ["", "#e5484d", "#f5a524", "#5fb760", "#18a05e"];

function Logo({ dark }) {
  return (
    <div className={"brand" + (dark ? " dark" : "")}>
      <i><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3z" />
        <path fill="currentColor" opacity=".75" d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z" />
      </svg></i>
      <span>Qaz<b>Course</b></span>
    </div>
  );
}
function BigLogo() {
  const [img, setImg] = useState(true);
  return (
    <div className="tl">
      {img ? <img src="img/logo.png" alt="QazCourse" onError={() => setImg(false)} /> : (<>
        <svg viewBox="0 0 120 112" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#27c4e6" /><stop offset="1" stopColor="#1e63e9" /></linearGradient></defs>
          <circle cx="56" cy="66" r="34" fill="none" stroke="url(#lg)" strokeWidth="13" />
          <path d="M76 86l26 20" stroke="url(#lg)" strokeWidth="13" strokeLinecap="round" />
          <path d="M38 62q9-6 18 0q9-6 18 0v18q-9-6-18 0q-9-6-18 0z" fill="#fff" />
          <path d="M8 30l46-20l46 20l-46 20z" fill="url(#lg)" /><path d="M96 31v22" stroke="#27c4e6" strokeWidth="3" />
        </svg>
        <span>Qaz<b>Course</b></span></>)}
    </div>
  );
}
function Field({ id, label, error, children }) {
  return (<div className="f"><label htmlFor={id}>{label}</label>{children}{error && <p className="err">{error}</p>}</div>);
}
function Auth({ onDone }) {
  const [mode, setMode] = useState("login");
  const [v, setV] = useState({ name: "", email: "", password: "", role: "student", agree: false });
  const [errs, setErrs] = useState({});
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [fail, setFail] = useState("");
  const reg = mode === "register";
  const set = k => e => setV({ ...v, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const s = strength(v.password);
  function validate() {
    const e = {};
    if (reg && v.name.trim().length < 2) e.name = "Атыңызды енгізіңіз (кемінде 2 таңба)";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = "Жарамды email енгізіңіз";
    if (!v.password) e.password = "Құпиясөзді енгізіңіз";
    else if (reg && v.password.length < 8) e.password = "Кемінде 8 таңба";
    if (reg && !v.agree) e.agree = "Аккаунт жасау үшін келісім қажет";
    return e;
  }
  async function submit(ev) {
    ev.preventDefault();
    const er = validate(); setErrs(er);
    if (Object.keys(er).length) return;
    setBusy(true); setFail("");
    try { const u = reg ? await api.register(v) : await api.login(v); store.set(u); onDone(u, reg); }
    catch (x) { setFail("Сұранысты орындау мүмкін болмады. Қайталап көріңіз."); setBusy(false); }
  }
  return (
    <div className="card">
      <div className="tabs" role="tablist">
        {[["login", "Кіру"], ["register", "Тіркелу"]].map(([k, t]) => (
          <button key={k} type="button" role="tab" aria-selected={mode === k}
            onClick={() => { setMode(k); setErrs({}); setFail(""); }}>{t}</button>))}
      </div>
      <h2>{reg ? "Аккаунт жасаңыз" : "Қайта келгеніңізбен!"}</h2>
      <p className="sub">{reg ? "Бірнеше минутта оқуды бастаңыз" : "Оқуды жалғастыру үшін жүйеге кіріңіз"}</p>
      {fail && <div className="banner" role="alert">{fail}</div>}
      <form onSubmit={submit} noValidate>
        {reg && (<Field id="name" label="Атыңыз" error={errs.name}>
          <input id="name" type="text" autoComplete="name" placeholder="Мақсат" value={v.name} onChange={set("name")} aria-invalid={!!errs.name} /></Field>)}
        <Field id="email" label="Email" error={errs.email}>
          <input id="email" type="email" autoComplete="email" placeholder="name@example.com" value={v.email} onChange={set("email")} aria-invalid={!!errs.email} /></Field>
        <Field id="password" label="Құпиясөз" error={errs.password}>
          <div className="in">
            <input id="password" type={show ? "text" : "password"} autoComplete={reg ? "new-password" : "current-password"}
              placeholder={reg ? "Кемінде 8 таңба" : "Сіздің құпиясөзіңіз.."} value={v.password} onChange={set("password")} aria-invalid={!!errs.password} />
            <button type="button" className="show" onClick={() => setShow(!show)}>{show ? "Жасыру" : "Көрсету"}</button>
          </div>
          {reg && v.password && (<div className="meter" aria-live="polite">
            {[1, 2, 3, 4].map(i => <span key={i} style={{ background: i <= s ? COLORS[s] : undefined }} />)}<small>{LEVELS[s]}</small></div>)}
        </Field>
        {reg && (<div className="f"><label>Я хочу</label><div className="seg">
          {[["student", "🎓 Оқу"], ["author", "✍️ Оқыту"]].map(([k, t]) => (
            <button key={k} type="button" aria-pressed={v.role === k} onClick={() => setV({ ...v, role: k })}>{t}</button>))}</div></div>)}
        {reg && (<div className="f"><label className="chk"><input type="checkbox" checked={v.agree} onChange={set("agree")} />
          <span>Жеке деректерді өңдеуге келісемін және пайдалану шарттарын қабылдаймын</span></label>
          {errs.agree && <p className="err">{errs.agree}</p>}</div>)}
        <button className="btn" type="submit" disabled={busy}>{busy ? "Күтіңіз..." : reg ? "Аккаунт жасау" : "Кіру"}</button>
      </form>
      <p className="note">Демо-версия: деректер серверге жіберілмейді.</p>
    </div>
  );
}

/* ===== ЖАҢА БӨЛІМ: Dashboard, курс, сабақ ===== */
const doneKey = u => "qc_done_" + u.email;
const getDone = u => { try { return JSON.parse(localStorage.getItem(doneKey(u))) || []; } catch (e) { return []; } };
const saveDone = (u, a) => { try { localStorage.setItem(doneKey(u), JSON.stringify(a)); } catch (e) {} };
const lessonsOf = c => c.topics.flatMap(t => t.lessons);
const Buy = ({ c }) => <button className="btn off" disabled title="Төлем жүйесі жақында қосылады">Сатып алу · {Access.price(c)}</button>;

function Dashboard({ user, fresh }) {
  const [hide, setHide] = useState(false);
  const done = getDone(user);
  return (<>
    {fresh && !hide && <div className="welc" onClick={() => setHide(true)}>🎉 Тіркелу сәтті өтті! QazCourse-қа қош келдіңіз.</div>}
    <h1 className="t">Сәлем, {user.name}! 👋</h1><p className="sub">Сыныбыңды таңдап, оқуды бастаңыз</p>
    <h2 id="courses" style={{ fontSize: 20 }}>Менің курстарым</h2>
    <div className="grid">{COURSES.map(c => {
      const all = lessonsOf(c), d = all.filter(l => done.includes(l.id)).length, p = all.length ? Math.round(d / all.length * 100) : 0;
      return (<article className="course" key={c.id}>
        <div className="grade">{c.grade}</div><span className={"tag" + (c.isFree ? "" : " paid")}>{Access.price(c)}</span>
        <h3>{c.title}</h3><div className="meta">{c.topics.length} тақырып · {all.length} сабақ</div>
        <div className="bar"><i style={{ width: p + "%" }} /></div><div className="meta">Өтілгені: {d}/{all.length}</div>
        {Access.can(c, user) ? <a className="btn" href={"#/course/" + c.id}>Курсты ашу</a> : <Buy c={c} />}
      </article>);
    })}</div>
  </>);
}

function Course({ user, id }) {
  const c = COURSES.find(x => x.id === id), done = getDone(user);
  if (!c) return <p>Курс табылмады. <a href="#/">Басты бет</a></p>;
  return (<>
    <div className="crumb"><a href="#/">Басты бет</a> / {c.title}</div>
    <h1 className="t">{c.title}</h1><p className="sub">Тақырыпты және сабақты таңдаңыз</p>
    {!Access.can(c, user) ? <div className="lock"><h2>Бұл курс ақылы</h2><Buy c={c} /></div> :
      c.topics.map(t => (<section className="topic" key={t.id}><h3>{t.title}</h3>
        {t.lessons.map(l => (<a className="les" key={l.id} href={"#/lesson/" + c.id + "/" + l.id}>
          <span>{l.title}</span>{done.includes(l.id) && <span className="ok">✓ Өтілді</span>}</a>))}</section>))}
  </>);
}

const TABS = [["presentations", "Презентациялар"], ["materials", "Теориялық материалдар"], ["exercises", "Есептер мен тапсырмалар"]];
function Lesson({ user, cid, lid }) {
  const c = COURSES.find(x => x.id === cid), l = c && lessonsOf(c).find(x => x.id === lid);
  const [tab, setTab] = useState("presentations");
  const [done, setDone] = useState(getDone(user));
  if (!c || !l || !Access.can(c, user)) return <p>Сабақ қолжетімсіз. <a href="#/">Басты бет</a></p>;
  const isDone = done.includes(l.id);
  const toggle = () => { const n = isDone ? done.filter(x => x !== l.id) : [...done, l.id]; saveDone(user, n); setDone(n); };
  return (<>
    <div className="crumb"><a href="#/">Басты бет</a> / <a href={"#/course/" + c.id}>{c.title}</a></div>
    <h1 className="t">{l.title}</h1>
    <div className="ptabs">{TABS.map(([k, n]) => <button key={k} className={"ptab" + (tab === k ? " on" : "")} onClick={() => setTab(k)}>{n}</button>)}</div>
    <div className="panel">{l[tab].length === 0 ? <div className="empty">Бұл бөлімнің материалдары жақын арада қосылады.</div> :
      l[tab].map((m, i) => (<div className="item" key={i}>
        <div><b>{m.title}</b>{m.text && <div className="meta">{m.text}</div>}{m.type === "video" && <iframe src={m.url} allowFullScreen title={m.title} />}</div>
        {m.type !== "video" && m.url && <a className="btn ghost" href={m.url} target="_blank" rel="noopener">Ашу</a>}</div>))}</div>
    <p><button className="btn ghost" onClick={toggle}>{isDone ? "✓ Өтілді (қайтару)" : "Сабақты өтілді деп белгілеу"}</button></p>
  </>);
}

function AppShell({ user, fresh, route, onOut }) {
  const [open, setOpen] = useState(false);
  useEffect(() => setOpen(false), [route]);
  const [, page, a, b] = route.split("/");
  const initial = (user.name || user.email).trim().charAt(0).toUpperCase();
  return (<div className="app">
    <aside className={"side" + (open ? " open" : "")}>
      <a href="#/"><Logo dark /></a>
      <a className={"nav" + (!page ? " on" : "")} href="#/">🏠 Басты бет</a>
      <a className={"nav" + (page === "course" || page === "lesson" ? " on" : "")} href="#/">📚 Менің курстарым</a>
      <span className="nav soon">💳 Төлемдер (жақында)</span><div className="sp" />
      <div className="me"><span className="av">{initial}</span><div><b>{user.name}</b><small>{user.email}</small></div></div>
      <button className="out" onClick={onOut}>Шығу</button>
    </aside>
    <div><div className="top"><button onClick={() => setOpen(!open)} aria-label="Мәзір">☰</button><Logo dark /></div>
      <main className="main">
        {page === "course" ? <Course user={user} id={a} /> : page === "lesson" ? <Lesson key={b} user={user} cid={a} lid={b} /> : <Dashboard user={user} fresh={fresh} />}
      </main></div>
  </div>);
}

function App() {
  const [user, setUser] = useState(store.get());
  const [fresh, setFresh] = useState(false);
  const [route, setRoute] = useState(location.hash.slice(1) || "/");
  useEffect(() => { const h = () => { setRoute(location.hash.slice(1) || "/"); window.scrollTo(0, 0); }; window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);
  useEffect(() => { document.body.classList.toggle("guest", !user); }, [user]);
  if (user) return <AppShell user={user} fresh={fresh} route={route} onOut={() => { store.set(null); setUser(null); setFresh(false); location.hash = "/"; }} />;
  return (<><div className="bg" aria-hidden="true" />
    <div className="authpage"><BigLogo />
      <div className="tag">Арманыңды<br />білімен жүзеге асыр</div>
      <div className="stack"><Auth onDone={(u, isNew) => { setFresh(!!isNew); setUser(u); location.hash = "/"; }} /></div>
    </div></>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
